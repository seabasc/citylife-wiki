  <style>
    :root { --bg:#0d0b0d; --surface:#171316; --surface-2:#231b1f; --line:#3b2b31; --line-soft:#281d21; --text:#f5f1f2; --muted:#b1a4a8; --accent:#d15b65; --accent-2:#e3bc72; --danger:#ef6b73; --sidebar:310px; --display:Bahnschrift, "Segoe UI Variable Display", "Arial Narrow", sans-serif; --sans:"Segoe UI Variable Text", Aptos, "Segoe UI", sans-serif; --body:"Segoe UI Variable Text", Aptos, "Segoe UI", sans-serif; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; }
    body { margin:0; background:linear-gradient(120deg, #0b090b 0%, #151013 52%, #0d0a0c 100%); color:var(--text); font:15px/1.65 var(--body); scrollbar-width:thin; scrollbar-color:#574047 transparent; }
    body::before { content:''; position:fixed; inset:0; pointer-events:none; opacity:.34; background-image:linear-gradient(#ffffff05 1px, transparent 1px), linear-gradient(90deg, #ffffff05 1px, transparent 1px); background-size:44px 44px; mask-image:linear-gradient(to bottom, #000, transparent 70%); }

    *::-webkit-scrollbar-thumb:hover { background:#556477; }
    button, input { font:inherit; }
    button { cursor:pointer; }

    .sidebar { position:sticky; top:0; height:100vh; overflow-y:auto; border-right:1px solid var(--line); background:linear-gradient(180deg, #171215, #100d0f); padding:24px 14px; z-index:4; box-shadow:16px 0 44px #02060c38; }
    .sidebar-close, .sidebar-scrim { display:none; }
    .brand { display:flex; align-items:center; gap:11px; padding:0 10px 24px; border-bottom:1px solid var(--line); margin-bottom:18px; font-family:Arial, sans-serif; }
    .brand-mark { width:46px; height:38px; flex:none; object-fit:contain; filter:drop-shadow(0 5px 12px #0008); }
    .brand strong { display:block; letter-spacing:.03em; font-size:14px; }
    .brand small { display:block; color:var(--muted); font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
    .home-button, .article-link { width:100%; border:0; background:transparent; color:var(--muted); text-align:left; }
    .home-button { padding:10px; margin-bottom:14px; font-family:Arial, sans-serif; font-size:13px; border-left:2px solid transparent; }
    .home-button:hover, .home-button.active { color:var(--text); background:var(--surface); border-left-color:var(--accent); }
    .rules-button { display:block; width:calc(100% - 12px); margin:0 6px 18px; border:1px solid var(--line); background:var(--surface); color:var(--text); padding:9px 10px; text-align:left; font-family:Arial, sans-serif; font-size:12px; font-weight:700; letter-spacing:.04em; }
    .rules-button:hover, .rules-button.active { border-color:var(--accent-2); background:var(--surface-2); }
    .map-button, .editor-button { display:block; width:calc(100% - 12px); margin:0 6px 18px; border:1px solid var(--line); background:var(--surface); color:var(--text); padding:9px 10px; text-align:left; font-family:Arial, sans-serif; font-size:12px; font-weight:700; letter-spacing:.04em; }
    .map-button:hover, .map-button.active, .editor-button:hover { border-color:var(--accent); background:var(--surface-2); }
    .editor-button { margin-top:-8px; border-color:#49343b; color:#efc263; }
    .collab-button { display:flex; align-items:center; gap:8px; width:calc(100% - 12px); margin:-10px 6px 18px; border:1px solid var(--line); background:#0d151f; color:var(--muted); padding:8px 10px; text-align:left; font-size:11px; }
    .collab-button:hover { color:var(--text); border-color:#4b6279; }

    .collab-button.error .collab-dot { background:var(--danger); box-shadow:0 0 0 3px #ef6b7324; }
    .collab-dialog { width:min(430px, calc(100% - 28px)); max-height:min(720px, calc(100dvh - 28px)); padding:0; overflow:auto; border:1px solid #4a6078; border-radius:7px; background:#111b27; color:var(--text); box-shadow:0 28px 90px #000d; }

    .collab-close { display:grid; place-items:center; width:36px; height:36px; flex:none; padding:0; border:1px solid #41546a; border-radius:4px; background:#172331; color:var(--text); font-size:22px; }
    .collab-dialog p { color:#b7c5d1; font-size:13px; }

    .collab-code button { min-height:38px; border:1px solid #40566e; background:#172331; color:var(--text); }
    .collab-text-button { width:100%; margin-top:10px; border-color:#3a4c60 !important; background:transparent !important; color:var(--muted) !important; }
    .collab-error { padding:10px; border-left:2px solid var(--danger); background:#351e26; color:#ffc7ca !important; }
    html.collab-required body:not(.collab-authorized) .app { visibility:hidden; }
    .collab-gate[hidden] { display:none; }
    .collab-gate { position:fixed; z-index:300; inset:0; display:none; place-items:center; overflow:auto; padding:24px; background:linear-gradient(135deg, #0b090a 0%, #1a1014 48%, #0d090b 100%); }
    html.collab-required .collab-gate:not([hidden]) { display:grid; }
    .collab-gate::before { content:''; position:fixed; inset:0; pointer-events:none; opacity:.34; background-image:linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px); background-size:42px 42px; mask-image:linear-gradient(to bottom, #000, transparent 80%); }
    .collab-gate-card { position:relative; width:min(440px, 100%); padding:26px; border:1px solid #54373f; border-top:2px solid var(--accent); border-radius:7px; background:#171215f2; box-shadow:0 28px 90px #000b; }
    .collab-gate-brand { display:flex; align-items:center; gap:13px; margin-bottom:18px; }
    .collab-gate-logo { width:68px; height:50px; flex:none; object-fit:contain; filter:drop-shadow(0 7px 13px #0009); }
    .collab-gate-brand small { display:block; color:var(--accent); font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
    .collab-gate-brand h1 { margin:2px 0 0; font-size:22px; }
    .collab-gate-intro { margin:0 0 18px; color:#b7c5d1; font-size:13px; }
    .collab-gate form { display:grid; gap:12px; }
    .collab-gate label { display:grid; gap:5px; color:var(--muted); font-size:11px; }
    .collab-gate input { width:100%; padding:10px; border:1px solid #3b5067; border-radius:4px; outline:none; background:#08111a; color:var(--text); }
    .collab-gate input:focus { border-color:var(--accent); box-shadow:0 0 0 3px #d15b651f; }
    .collab-gate button[type="submit"] { min-height:42px; border:1px solid #bd4e58; border-radius:4px; background:#3a171c; color:#f1b7bc; font-weight:700; }
    .collab-loading-card { width:min(370px, 100%); padding:38px 28px; text-align:center; }
    .collab-loading-logo { display:block; width:min(210px, 72%); height:auto; margin:0 auto 24px; filter:drop-shadow(0 14px 24px #0009); }
    .collab-loader { display:block; width:28px; height:28px; margin:0 auto 15px; border:2px solid #6d4a51; border-top-color:var(--accent); border-radius:50%; animation:collab-spin .8s linear infinite; }
    .collab-loading-card strong { display:block; font-family:var(--display); font-size:18px; }
    .collab-loading-card p { margin:4px 0 0; color:var(--muted); font-size:12px; }
    @keyframes collab-spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion:reduce) { .collab-loader { animation-duration:1.8s; } }
    .collab-owner-setup { margin-top:18px; border-top:1px solid #2c3d50; padding-top:14px; color:var(--muted); font-size:11px; }
    .collab-owner-setup summary { cursor:pointer; }
    .collab-owner-setup form { margin-top:14px; }
    body.collab-locked #addPoi, body.collab-locked [data-tool], body.collab-locked .color-picker, body.collab-locked .map-brush, body.collab-locked .map-action-lane, body.collab-locked .map-library { display:none !important; }
    body.collab-locked .map-drawings { pointer-events:none; }
    .search-wrap { position:relative; margin:0 6px 18px; }
    .search { width:100%; border:1px solid var(--line); background:var(--surface); color:var(--text); padding:10px 12px 10px 34px; outline:none; font-family:Arial, sans-serif; font-size:13px; }

    .search-icon { position:absolute; left:12px; top:9px; color:var(--muted); font-family:Arial, sans-serif; }
    .group { margin:3px 0; }
    .group-toggle { border:0; width:100%; color:var(--text); background:transparent; display:flex; align-items:center; gap:9px; padding:9px 10px; text-align:left; font-family:Arial, sans-serif; font-size:12px; font-weight:700; letter-spacing:.035em; }
    .group-toggle:hover { background:var(--surface); }

      const zipCrcTable = Array.from({ length:256 }, (_, index) => {
        let value = index;
        for (let bit = 0; bit < 8; bit++) value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
        return value >>> 0;
      });

      function zipCrc32(bytes) {
        let crc = 0xffffffff;
        for (const byte of bytes) crc = zipCrcTable[(crc ^ byte) & 0xff] ^ (crc >>> 8);
        return (crc ^ 0xffffffff) >>> 0;
      }

      function writeZipNumber(view, offset, value, bytes) {
        for (let index = 0; index < bytes; index++) view.setUint8(offset + index, (value >>> (index * 8)) & 0xff);
      }

      function createZipBlob(files) {
        const encoder = new TextEncoder();
        const records = [];
        const chunks = [];
        let offset = 0;
        const now = new Date();
        const zipTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
        const zipDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
        files.forEach(file => {
          const name = encoder.encode(file.name.replace(/\\/g, '/'));
          const data = file.bytes instanceof Uint8Array ? file.bytes : encoder.encode(String(file.bytes ?? ''));
          const crc = zipCrc32(data);
          const header = new Uint8Array(30 + name.length);
          const headerView = new DataView(header.buffer);
          writeZipNumber(headerView, 0, 0x04034b50, 4);
          writeZipNumber(headerView, 4, 20, 2);
          writeZipNumber(headerView, 6, 0, 2);
          writeZipNumber(headerView, 8, 0, 2);
          writeZipNumber(headerView, 10, zipTime, 2);
          writeZipNumber(headerView, 12, zipDate, 2);
          writeZipNumber(headerView, 14, crc, 4);
          writeZipNumber(headerView, 18, data.length, 4);
          writeZipNumber(headerView, 22, data.length, 4);
          writeZipNumber(headerView, 26, name.length, 2);
          header.set(name, 30);
          records.push({ name, crc, size:data.length, offset });
          chunks.push(header, data);
          offset += header.length + data.length;
        });
        const centralStart = offset;
        records.forEach(record => {
          const header = new Uint8Array(46 + record.name.length);
          const view = new DataView(header.buffer);
          writeZipNumber(view, 0, 0x02014b50, 4);
          writeZipNumber(view, 4, 20, 2);
          writeZipNumber(view, 6, 20, 2);
          writeZipNumber(view, 8, 0, 2);
          writeZipNumber(view, 10, 0, 2);
          writeZipNumber(view, 12, zipTime, 2);
          writeZipNumber(view, 14, zipDate, 2);
          writeZipNumber(view, 16, record.crc, 4);
          writeZipNumber(view, 20, record.size, 4);
          writeZipNumber(view, 24, record.size, 4);
          writeZipNumber(view, 28, record.name.length, 2);
          writeZipNumber(view, 42, record.offset, 4);
          header.set(record.name, 46);
          chunks.push(header);
          offset += header.length;
        });
        const end = new Uint8Array(22);
        const endView = new DataView(end.buffer);
        writeZipNumber(endView, 0, 0x06054b50, 4);
        writeZipNumber(endView, 8, records.length, 2);
        writeZipNumber(endView, 10, records.length, 2);
        writeZipNumber(endView, 12, offset - centralStart, 4);
        writeZipNumber(endView, 16, centralStart, 4);
        chunks.push(end);
        return new Blob(chunks, { type:'application/zip' });
      }

      function bytesFromBase64(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
        return bytes;
      }

      function fileNameForPage(page, usedNames) {
        const pathName = page.url ? new URL(page.url).pathname.replace(/^\/+/, '').replace(/\.md$/i, '') : '';
        const base = slugify(pathName || page.title) || `article-${Date.now()}`;
        let name = `${base}.md`;
        let copy = 2;
        while (usedNames.has(name)) name = `${base}-${copy++}.md`;
        usedNames.add(name);
        return name;
      }

      function extractWikiUploads(content, page, uploadFiles) {
        let uploadIndex = 1;
        const pageSlug = slugify(pageId(page)) || 'article';
        return String(content || '').replace(/src=(['"])data:([^;]+);base64,([^'"]+)\1/g, (match, quote, mime, base64) => {
          const extension = mime.includes('png') ? 'png' : mime.includes('webp') ? 'webp' : mime.includes('gif') ? 'gif' : 'jpg';
          const fileName = `assets/wiki-uploads/${pageSlug}-${uploadIndex++}.${extension}`;
          uploadFiles.push({ name:fileName, bytes:bytesFromBase64(base64) });
          return `src=${quote}${fileName}${quote}`;
        });
      }

      async function imageFileToDataUrl(file) {
        const rawUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        if (!file.type.startsWith('image/')) return rawUrl;
        const image = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = rawUrl;
        });
        const max = 1600;
        const scale = Math.min(1, max / Math.max(image.width, image.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', .86);
      }

      function searchTerms(query) {
        const words = plainText(query).toLowerCase().split(/\s+/).filter(word => word.length > 1 && !searchStopWords.has(word));
        return [...new Set(words.flatMap(word => [word, ...(searchAliases[word] || [])]))];
      }

      function searchWiki(query, limit = 30) {
        const normalized = plainText(query).toLowerCase();
        if (!normalized) return [];
        const terms = searchTerms(normalized);
        const ranked = new Map();
        const addResults = (searchQuery, weight) => {
          state.fuse.search(searchQuery, { limit:50 }).forEach(result => {
            const id = pageId(result.item);
            const entry = ranked.get(id) || { page:result.item, relevance:0 };
            entry.relevance += Math.max(0, 1 - (result.score ?? 1)) * weight;
            ranked.set(id, entry);
          });
        };
        addResults(normalized, normalized.split(/\s+/).length > 3 ? 1.25 : 4);
        terms.forEach((term, index) => addResults(term, index < normalized.split(/\s+/).length ? 1.5 : .65));
        ranked.forEach(entry => {
          const title = entry.page.title.toLowerCase();
          const category = entry.page.searchCategory.toLowerCase();
          if (title === normalized) entry.relevance += 12;
          else if (title.startsWith(normalized)) entry.relevance += 7;
          else if (title.includes(normalized)) entry.relevance += 5;
          entry.relevance += terms.filter(term => title.includes(term)).length * 2.2;
          entry.relevance += terms.filter(term => category.includes(term)).length * .8;
          const path = entry.page.searchPath.toLowerCase();
          if (/\b(store|stash|keep)\b.*\b(items?|stuff|belongings?)\b|\b(items?|stuff)\b.*\b(store|stash|keep)\b/.test(normalized) && title === 'storage units') entry.relevance += 14;
          if (/\b(make|cook|manufacture)\b.*\bmeth\b/.test(normalized) && title === 'manufacturing meth') entry.relevance += 10;
          if (/\b(join|connect|enter)\b.*\b(server|city|game)\b/.test(normalized) && title === 'how to connect') entry.relevance += 12;
          if (/\b(start|create|make)\b.*\bgang\b/.test(normalized) && path.includes('gang life getting started')) entry.relevance += 12;
          if (/\b(job|work|career)\b/.test(normalized) && entry.page.searchCategory === 'Jobs & Careers') entry.relevance += 2;
          if (/\b(rule|rules|rdm|vdm)\b/.test(normalized) && entry.page.searchType === 'rules') entry.relevance += 10;
        });
        return [...ranked.values()].sort((a, b) => b.relevance - a.relevance || a.page.title.localeCompare(b.page.title)).slice(0, limit);
      }

      function highlightSearchText(text, terms) {
        if (!terms.length) return escapeHtml(text);
        const pattern = new RegExp(`(${terms.map(term => term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`, 'gi');
        return String(text).split(pattern).map((part, index) => index % 2 ? `<mark>${escapeHtml(part)}</mark>` : escapeHtml(part)).join('');
      }

      function searchExcerpt(page, terms) {
        const text = page.searchText || plainText(page.content);
        const lower = text.toLowerCase();
        const positions = terms.map(term => lower.indexOf(term)).filter(index => index >= 0);
        const matchIndex = positions.length ? Math.min(...positions) : 0;
        let start = Math.max(0, matchIndex - 85);
        let end = Math.min(text.length, start + 230);
        if (start > 0) start = text.indexOf(' ', start) + 1;
        if (end < text.length) end = text.lastIndexOf(' ', end);
        return `${start > 0 ? '…' : ''}${text.slice(start, end).trim()}${end < text.length ? '…' : ''}`;
      }

      function addMapAudit(items, previousItems) {
        const author = collaboration?.author();
        if (!author) return items;
        const previous = new Map(previousItems.map(item => [item.id, item]));
        const comparable = item => JSON.stringify(Object.fromEntries(Object.entries(item).filter(([key]) => !['createdBy', 'createdAt', 'updatedBy', 'updatedAt'].includes(key))));
        return items.map(item => {
          const prior = previous.get(item.id);
          if (prior && comparable(prior) === comparable(item)) return item;
          const now = new Date().toISOString();
          return { ...item, createdBy:prior?.createdBy || author, createdAt:prior?.createdAt || now, updatedBy:author, updatedAt:now };
        });
      }

      function saveLocations(locations, sync = true, audit = true) {
        localStorage.setItem('santos-cartel-map-locations', JSON.stringify(audit ? addMapAudit(locations, savedLocations()) : locations));
        if (sync) collaboration?.saveSoon();
      }

        toast.classList.add('visible');

      function renderSnapshotsPanel(panel) {

          localStorage.setItem('santos-cartel-map-snapshots', JSON.stringify(list));

          showMapToast(`Snapshot "${name.trim()}" saved`);
        });
        panel.querySelectorAll('[data-restore-snapshot]').forEach(button => button.addEventListener('click', () => {

      function downloadMapPlan() {
        const plan = { version: 1, exportedAt: new Date().toISOString(), drawings: savedDrawings(), locations: savedLocations(), layers: state.map.annotationLayers };

        link.href = URL.createObjectURL(new Blob([JSON.stringify(plan, null, 2)], { type: 'application/json' }));
        link.download = 'santos-cartel-map-plan.json'; link.click(); URL.revokeObjectURL(link.href);
      }

      function importMapPlan(file) {
        const reader = new FileReader();
        reader.onload = () => { try { const plan = JSON.parse(reader.result); if (!Array.isArray(plan.drawings) || !Array.isArray(plan.locations)) throw new Error(); captureMapHistory(); saveDrawings(plan.drawings, false); saveLocations(plan.locations); if (plan.layers) state.map.annotationLayers = { ...state.map.annotationLayers, ...plan.layers }; state.map.selectedDrawings = []; renderMap(); } catch { alert('This file is not a valid map plan.'); } };
        reader.readAsText(file);
      }

      function captureMapHistory() {
        state.map.history.push({ drawings: localStorage.getItem('santos-cartel-map-drawings') || '[]', locations: localStorage.getItem('santos-cartel-map-locations') || '[]' });
        if (state.map.history.length > 50) state.map.history.shift();
      }

      function undoMapChange() {
        const prior = state.map.history.pop();
        if (!prior) return false;
        saveDrawings(JSON.parse(prior.drawings), false);
        saveLocations(JSON.parse(prior.locations));
        state.map.selectedDrawings = [];
        state.selectedLocation = null;
        document.getElementById('mapDetail')?.setAttribute('hidden', '');
        renderMap();
        return true;
      }

      function hexToHsv(hex) {
        const value = hex.replace('#', '');
        const red = parseInt(value.slice(0, 2), 16) / 255;
        const green = parseInt(value.slice(2, 4), 16) / 255;
        const blue = parseInt(value.slice(4, 6), 16) / 255;
        const max = Math.max(red, green, blue), min = Math.min(red, green, blue), delta = max - min;
        let hue = 0;
        if (delta) hue = max === red ? 60 * (((green - blue) / delta) % 6) : max === green ? 60 * ((blue - red) / delta + 2) : 60 * ((red - green) / delta + 4);
        return { hue: (hue + 360) % 360, saturation: max ? delta / max * 100 : 0, value: max * 100 };
      }

      function hsvToHex(hue, saturation, value) {
        const chroma = value / 100 * saturation / 100;
        const segment = hue / 60;
        const secondary = chroma * (1 - Math.abs(segment % 2 - 1));
        const match = value / 100 - chroma;
        const [red, green, blue] = segment < 1 ? [chroma, secondary, 0] : segment < 2 ? [secondary, chroma, 0] : segment < 3 ? [0, chroma, secondary] : segment < 4 ? [0, secondary, chroma] : segment < 5 ? [secondary, 0, chroma] : [chroma, 0, secondary];
        return `#${[red, green, blue].map(channel => Math.round((channel + match) * 255).toString(16).padStart(2, '0')).join('')}`;
      }

      function preloadMapLayers() {
        Object.values(mapLayerSources).forEach(source => {
          const image = new Image();
          image.src = source;
        });
      }

      function switchMapLayer(layer) {
        state.map.layer = layer;
        setMapEdgeColor(layer);
        const image = document.getElementById('mapImage');
        if (!image || image.getAttribute('src') === mapLayerSources[layer]) return;
        const reveal = new Image();
        reveal.className = 'map-layer-reveal';
        reveal.src = mapLayerSources[layer];
        reveal.alt = '';
        reveal.addEventListener('animationend', () => { image.src = mapLayerSources[layer]; reveal.remove(); }, { once:true });
        image.after(reveal);
        document.querySelectorAll('[data-layer]').forEach(button => button.classList.toggle('active', button.dataset.layer === layer));
      }

      function setMapEdgeColor(layer = state.map.layer) {

        document.querySelector('.map-stage')?.style.setProperty('background-color', color);

join('')}</div><button type="button" class="color-done" id="colorDone">Done</button></div></div></div><div class="map-zoom"><button type="button" data-zoom="out" title="Zoom out">-</button><button type="button" data-zoom="reset" title="Reset map">o</button><button type="button" data-zoom="in" title="Zoom in">+</button></div></div><div class="map-action-lane">${actions}</div>`;
        document.querySelectorAll('[data-layer]').forEach(button => button.addEventListener('click', () => switchMapLayer(button.dataset.layer)));
        document.querySelectorAll('[data-zoom]').forEach(button => button.addEventListener('click', () => { const zoom = button.dataset.zoom; state.map.scale = zoom === 'reset' ? 1 : Math.min(20, Math.max(1, state.map.scale * (zoom === 'in' ? 1.6 : 1 / 1.6))); if (zoom === 'reset') { state.map.x = 0; state.map.y = 0; } renderMap(); }));
        document.querySelectorAll('[data-tool]').forEach(button => button.addEventListener('click', () => { state.map.tool = button.dataset.tool; state.selectedLocation = null; document.getElementById('mapDetail').hidden = true; renderMap(); }));
        document.getElementById('gridToggle').addEventListener('click', () => { state.map.grid = !state.map.grid; document.getElementById('mapGrid').classList.toggle('visible', state.map.grid); document.getElementById('gridToggle').classList.toggle('active', state.map.grid); document.getElementById('mapGridCurrent').classList.toggle('visible', state.map.grid); highlightCenterCell(); });
        document.getElementById('activeLayerSelect').addEventListener('change', event => { state.map.activeAnnotationLayer = event.target.value; });
        const setBrushColor = color => { if (!/^#[0-9a-f]{6}$/i.test(color)) return; state.map.color = color.toLowerCase(); state.map.picker = hexToHsv(state.map.color); document.getElementById('colorTrigger').style.setProperty('--brush-color', state.map.color); document.getElementById('colorHex').value = state.map.color; const field = document.getElementById('colorField'); field.style.setProperty('--picker-hue', state.map.picker.hue); field.style.setProperty('--picker-x', state.map.picker.saturation); field.style.setProperty('--picker-y', state.map.picker.value); document.getElementById('hueStrip').value = state.map.picker.hue; };

          if (event.target.closest('.map-marker, .map-cluster, .map-drawing, .map-detail, .delete-confirm, .drawing-handle')) return;

      }

      function showLocation(id, focus = false) {
        const location = allLocations().find(item => item.id === id);
        if (!location) return;
        if (focus) focusLocation(location);
        state.selectedLocation = id;
        const detail = document.getElementById('mapDetail');
        detail.hidden = false;
        if (isMobile()) {
          detail.innerHTML = `<h2>${escapeHtml(location.name)}</h2><p>${escapeHtml(location.notes || 'No notes recorded for this location.')}</p>${location.updatedBy || location.createdBy ? `<p class="map-detail-meta">Last edited by ${escapeHtml(location.updatedBy || location.createdBy)}</p>` : ''}${location.guidePath ? '<button class="poi-open" type="button">Open linked guide</button>' : ''}`;
          detail.querySelector('.poi-open')?.addEventListener('click', () => openArticle(state.pages.find(page => page.url && new URL(page.url).pathname === location.guidePath)));
          renderMap();
          if (focus) requestAnimationFrame(() => document.querySelector('.map-workspace')?.scrollTo({ top: 0, behavior: 'smooth' }));
          return;
        }
        const transform = location.drawing?.transform || { scale: 1, rotation: 0 };
        detail.innerHTML = `<h2>${escapeHtml(location.name)}</h2><p>${escapeHtml(location.notes || 'No notes recorded for this location.')}</p>${location.updatedBy || location.createdBy ? `<p class="map-detail-meta">Last edited by ${escapeHtml(location.updatedBy || location.createdBy)}</p>` : ''}${location.guidePath ? '<button class="poi-open" type="button">Open linked guide</button>' : ''}<button class="poi-open" type="button" id="editLocation">Edit</button>${state.map.selectedDrawings.length ? '<button class="poi-open" type="button" id="reassignLocation">Reassign selected drawing</button>' : ''}<button class="map-delete" type="button">Delete point</button>`;
        detail.querySelector('.poi-open')?.addEventListener('click', () => openArticle(state.pages.find(page => page.url && new URL(page.url).pathname === location.guidePath)));
        detail.querySelector('#editLocation').addEventListener('click', () => editLocation(location.id));
        detail.querySelector('#reassignLocation')?.addEventListener('click', () => reassignLocation(location.id));
        ['drawingScale', 'drawingRotation'].forEach(id => detail.querySelector(`#${id}`)?.addEventListener('input', () => updateDrawingTransform(location.id, Number(detail.querySelector('#drawingScale').value), Number(detail.querySelector('#drawingRotation').value))));
        detail.querySelector('.map-delete').addEventListener('click', () => { const saved = savedLocations().filter(item => item.id !== location.id); saveLocations(saved); state.selectedLocation = null; detail.hidden = true; renderMap(); });
        renderMap();
        if (isMobile()) {
          if (focus) { const ws = document.querySelector('.map-workspace'); if (ws) ws.scrollTo({ top: 0, behavior: 'smooth' }); }
          else { requestAnimationFrame(() => { const item = document.querySelector('.map-sidebar .poi-item.active'); if (item) item.scrollIntoView({ behavior: 'smooth', block: 'center' }); }); }
        }
      }

      function updateDrawingTransform(id, scale, rotation) {
        const saved = savedLocations();
        const location = saved.find(item => item.id === id);
        if (!location?.drawing) return;
        location.drawing.transform = { ...(location.drawing.transform || {}), scale, rotation };
        saveLocations(saved);
        const path = document.querySelector(`.map-drawing[data-poi="${id}"]`);
        path?.setAttribute('transform', `translate(${location.drawing.transform.x || 0} ${location.drawing.transform.y || 0}) rotate(${rotation} ${location.map.x} ${location.map.y}) scale(${scale} ${scale})`);
      }

      function editLocation(id) {
        const saved = savedLocations();
        const location = saved.find(item => item.id === id);
        if (!location) return;
        const form = document.getElementById('poiForm');
        let drawingIds = [...(location.drawingIds || [])];
        form.innerHTML = `<form class="map-form" id="locationEditor"><strong>Edit point of interest</strong><label>Name<input name="name" required value="${escapeHtml(location.name)}"></label><label>Type<select name="type">${['operation','resource','meeting','property','route','other'].map(type => `<option value="${type}" ${type === location.type ? 'selected' : ''}>${type}</option>`).join('')}</select></label><label>Linked guide<select name="guidePath"><option value="">None</option>${state.pages.filter(page => page.url).sort((a,b) => a.title.localeCompare(b.title)).map(page => `<option value="${escapeHtml(new URL(page.url).pathname)}" ${new URL(page.url).pathname === location.guidePath ? 'selected' : ''}>${escapeHtml(page.title)}</option>`).join('')}</select></label><label>Notes<textarea name="notes" rows="3">${escapeHtml(location.notes || '')}</textarea></label>${iconPickerFieldHtml('edit', location.iconSheet, location.iconIndex, location.iconSize)}<div class="map-form-actions"><button type="button" id="useSelection">Use selected drawing</button><span id="linkedDrawingStatus">${drawingIds.length ? `${drawingIds.length} drawing linked` : 'No drawing linked'}</span></div><div class="map-form-actions"><button>Save changes</button><button type="button" id="cancelEdit">Cancel</button></div></form>`;
        wireIconPicker('edit', location.iconSheet, location.iconIndex, icon => updateLiveMarker(id, form.querySelector('[name="type"]').value, icon));
        document.getElementById('useSelection').addEventListener('click', () => { drawingIds = [...state.map.selectedDrawings]; document.getElementById('linkedDrawingStatus').textContent = drawingIds.length ? `${drawingIds.length} drawing linked` : 'No drawing selected'; });
        form.querySelector('[name="type"]').addEventListener('change', event => updateLiveMarker(id, event.target.value, { sheet: Number(document.getElementById('editIconSheet').value) || null, index: document.getElementById('editIconIndex').value !== '' ? Number(document.getElementById('editIconIndex').value) : null, size: Number(document.getElementById('editIconSize').value) }));
        document.getElementById('cancelEdit').addEventListener('click', () => { form.innerHTML = ''; renderMap(); });
        document.getElementById('locationEditor').addEventListener('submit', event => { event.preventDefault(); const values = Object.fromEntries(new FormData(event.target)); const linked = savedDrawings().filter(drawing => drawingIds.includes(drawing.id)); const points = linked.flatMap(drawing => (drawing.points || []).map(point => transformedPoint(drawing, point))); location.name = values.name.trim(); location.type = values.type; location.guidePath = values.guidePath; location.notes = values.notes.trim(); location.drawingIds = drawingIds; const iconIndex = values.iconIndex !== '' ? Number(values.iconIndex) : undefined; if (Number.isInteger(iconIndex)) { location.iconSheet = Number(values.iconSheet); location.iconIndex = iconIndex; location.iconSize = Number(values.iconSize) || 22; } else { delete location.iconSheet; delete location.iconIndex; delete location.iconSize; } if (points.length) location.map = points.reduce((total, point) => ({ x:total.x + point.x / points.length, y:total.y + point.y / points.length }), {x:0,y:0}); saveLocations(saved); form.innerHTML = ''; renderMap(); showLocation(id, false); });
      }

      function updateLiveMarker(id, type, icon) {
        const marker = document.querySelector(`[data-poi-marker="${id}"]`);
        if (!marker) return;
        const hasIcon = icon && Number.isInteger(icon.index) && ICON_SHEETS[icon.sheet];
        const size = hasIcon ? (icon.size || 22) : 22;
        marker.classList.toggle('has-icon', Boolean(hasIcon));
        marker.style.cssText = `left:${marker.style.left};top:${marker.style.top};--poi-color:${LOCATION_TYPE_COLORS[type] || LOCATION_TYPE_COLORS.other};--marker-zoom-scale:${1 / state.map.scale};${hasIcon ? `width:${size}px;height:${size}px;${iconBgStyle(icon.sheet, icon.index, size)}` : ''}`;
      }

      function reassignLocation(id) {
        const selected = savedDrawings().filter(drawing => state.map.selectedDrawings.includes(drawing.id));
        if (!selected.length) return;
        const points = selected.flatMap(drawing => (drawing.points || []).map(point => transformedPoint(drawing, point)));
        const center = points.reduce((total, point) => ({ x:total.x + point.x / points.length, y:total.y + point.y / points.length }), { x:0, y:0 });
        const saved = savedLocations();
        const location = saved.find(item => item.id === id);
        if (!location) return;
        captureMapHistory();
        location.drawingIds = selected.map(drawing => drawing.id);
        location.map = center;
        saveLocations(saved, false);
        saveDrawings(savedDrawings().map(drawing => ({ ...drawing, pinId: state.map.selectedDrawings.includes(drawing.id) ? id : drawing.pinId })));
        state.map.selectedDrawings = [];
        renderMap();
        showLocation(id, false);
      }

      function showPoiIconStep(x, y) {
        const form = document.getElementById('poiForm');
        let sheet = 1;
        form.innerHTML = `<div class="map-form icon-first-step">
          <strong>Choose a map icon</strong>
          <p class="icon-first-hint">Pick an icon for this point of interest, or skip to use a plain color pin.</p>
          <div class="icon-picker-tabs">
            <button type="button" class="icon-tab active" data-sheet="1">Sheet 1</button>
            <button type="button" class="icon-tab" data-sheet="2">Sheet 2</button>
          </div>
          <div class="icon-picker-grid" id="iconFirstGrid"></div>
          <div class="map-form-actions">
            <button type="button" id="skipIconStep">Skip icon</button>
            <button type="button" id="cancelIconStep">Cancel</button>
          </div>
        </div>`;
        const grid = document.getElementById('iconFirstGrid');
        const tabs = [...form.querySelectorAll('.icon-tab')];
        setPoiPreview(x, y, 'operation', null);
        function renderGrid() {
          const cfg = ICON_SHEETS[sheet];
          let html = '';
          for (let i = 0; i < cfg.cols * cfg.rows; i++) html += `<button type="button" class="icon-choice" style="${iconBgStyle(sheet, i, 26)}" data-icon-pick="${i}"></button>`;
          grid.innerHTML = html;
          grid.querySelectorAll('[data-icon-pick]').forEach(btn => {
            btn.addEventListener('mouseenter', () => setPoiPreview(x, y, 'operation', { sheet, index: Number(btn.dataset.iconPick) }));
            btn.addEventListener('click', () => showPoiForm(x, y, null, [], { sheet, index: Number(btn.dataset.iconPick) }));
          });
        }
        tabs.forEach(tab => tab.addEventListener('click', () => { sheet = Number(tab.dataset.sheet); tabs.forEach(t => t.classList.toggle('active', t === tab)); renderGrid(); }));
        document.getElementById('skipIconStep').addEventListener('click', () => showPoiForm(x, y, null, [], null));
        document.getElementById('cancelIconStep').addEventListener('click', () => { clearPoiPreview(); form.innerHTML = ''; });
        renderGrid();
      }

      function showPoiForm(x = '', y = '', drawing = null, drawingIds = [], presetIcon = null) {
        const form = document.getElementById('poiForm');
        form.innerHTML = `<form class="map-form" id="poiEditor"><label>Name<input name="name" required></label><label>Type<select name="type"><option value="operation">Operation</option><option value="resource">Resource</option><option value="meeting">Meeting</option><option value="property">Property</option><option value="route">Route</option><option value="other">Other</option></select></label><label>Linked guide<select name="guidePath"><option value="">None</option>${state.pages.filter(page => page.url).sort((a,b) => a.title.localeCompare(b.title)).map(page => `<option value="${escapeHtml(new URL(page.url).pathname)}">${escapeHtml(page.title)}</option>`).join('')}</select></label><label>Notes<textarea name="notes" rows="3"></textarea></label>${iconPickerFieldHtml('new', presetIcon?.sheet, presetIcon?.index, presetIcon?.size)}<input name="x" type="hidden" value="${x}"><input name="y" type="hidden" value="${y}"><div class="map-form-actions"><button>Save point</button><button type="button" id="cancelPoi">Cancel</button></div></form>`;
        let previewType = 'operation';
        let previewIcon = presetIcon;
        setPoiPreview(x, y, previewType, previewIcon);
        wireIconPicker('new', presetIcon?.sheet, presetIcon?.index, icon => { previewIcon = icon; setPoiPreview(x, y, previewType, previewIcon); });
        form.querySelector('[name="type"]').addEventListener('change', event => { previewType = event.target.value; setPoiPreview(x, y, previewType, previewIcon); });
        document.getElementById('cancelPoi').addEventListener('click', () => { clearPoiPreview(); form.innerHTML = ''; });
        document.getElementById('poiEditor').addEventListener('submit', event => { event.preventDefault(); const values = Object.fromEntries(new FormData(event.target)); const saved = savedLocations(); const id = `poi-${Date.now()}`; const iconSheet = values.iconSheet ? Number(values.iconSheet) : undefined; const iconIndex = values.iconIndex !== '' ? Number(values.iconIndex) : undefined; const iconSize = Number(values.iconSize) || 22; saved.push({ id, name: values.name.trim(), type: values.type, guidePath: values.guidePath, notes: values.notes.trim(), map: { x: Number(values.x || 50), y: Number(values.y || 50) }, drawingIds, ...(Number.isInteger(iconIndex) ? { iconSheet, iconIndex, iconSize } : {}), ...(drawing ? { drawing: { points: drawing, transform: { scale: 1, rotation: 0, x: 0, y: 0 } } } : {}) }); saveLocations(saved, !drawingIds.length); if (drawingIds.length) { const drawings = savedDrawings().map(item => drawingIds.includes(item.id) ? { ...item, pinId: id } : item); saveDrawings(drawings); state.map.selectedDrawings = []; } clearPoiPreview(); form.innerHTML = ''; renderMap(); });
      }

      function openArticle(page) {
        if (!page) return;
        main.classList.remove('map-main');
        const category = categoryFor(page);
        const raw = normalizeSource(page.content || 'No content is available for this article.');
        const content = marked.parse(raw);
        const sourcePath = page.url ? new URL(page.url).pathname : '';
        const relatedRules = state.ruleGuideLinks.filter(link => link.guidePath === sourcePath);
        setActive(pageId(page));
        buildNav();
        main.innerHTML = `<article class="article"><div class="breadcrumb"><button id="crumbHome" type="button">Home</button> / ${escapeHtml(category?.name || 'Wiki')} / ${escapeHtml(page.title)}</div>
          <div><div class="topline"><button class="menu" id="menuButton" type="button">Menu</button><div class="article-actions"><span>${escapeHtml(category?.name || 'Wiki')}</span><button class="article-edit-button" id="editCurrentArticle" type="button">Edit article</button></div></div><header class="article-head"><h1>${escapeHtml(page.title)}</h1><div class="article-meta">City Life / Santos Cartel Community Wiki</div></header><div class="prose" id="articleBody">${content}</div>${relatedRules.length ? `<div class="article-rules"><span>Related rules</span>${relatedRules.map(link => `<button type="button" data-rule-section="${escapeHtml(link.ruleSection)}" data-rule-occurrence="${link.occurrence}">${escapeHtml(link.ruleSection)}</button>`).join('')}</div>` : ''}</div><aside class="toc" id="toc"><strong>On this page</strong></aside></article>`;
        document.getElementById('crumbHome').addEventListener('click', showHome);
        document.getElementById('editCurrentArticle').addEventListener('click', () => openWikiEditor(page));
        document.getElementById('articleBody').addEventListener('click', event => {
          const link = event.target.closest('a');
          if (!link) return;
          const href = link.getAttribute('href') || '';
          if (href === 'wiki:rules') { event.preventDefault(); showRules(); return; }
          const path = new URL(link.href).pathname;
          const linkedPage = href.startsWith('wiki:')
            ? state.pages.find(item => item.id === href.slice(5))
            : state.pages.find(item => item.url && new URL(item.url).pathname === path);
          if (linkedPage) { event.preventDefault(); openArticle(linkedPage); }
        });
        main.querySelectorAll('[data-rule-section]').forEach(button => button.addEventListener('click', () => {
          showRules();
          const headings = [...document.querySelectorAll('.rules-section h2')];
          const matches = headings.filter(heading => heading.textContent === button.dataset.ruleSection);
          matches[Number(button.dataset.ruleOccurrence) - 1]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }));
        buildToc();
        animateView();
        wireMenu();
        main.scrollTop = 0;
        window.scrollTo({ top: 0, behavior: 'instant' });
        if (window.innerWidth <= 850) document.body.classList.remove('sidebar-open');
      }

      function buildToc() {
        const toc = document.getElementById('toc');
        const headings = [...document.querySelectorAll('#articleBody h2, #articleBody h3')];
        if (!headings.length) { toc.hidden = true; return; }
        const used = new Map();
        headings.forEach(heading => {
          const base = slugify(heading.textContent) || 'section';
          const count = used.get(base) || 0;
          used.set(base, count + 1);
          heading.id = count ? `${base}-${count + 1}` : base;
          toc.insertAdjacentHTML('beforeend', `<a class="toc-${heading.tagName.toLowerCase()}" href="#${heading.id}">${escapeHtml(heading.textContent)}</a>`);
        });
      }

      function wireMenu() {
        const button = document.getElementById('menuButton');
        button?.setAttribute('aria-expanded', String(document.body.classList.contains('sidebar-open')));
        button?.addEventListener('click', () => setSidebarOpen(!document.body.classList.contains('sidebar-open')));
      }

      function setSidebarOpen(open) {
        document.body.classList.toggle('sidebar-open', open);
        document.getElementById('menuButton')?.setAttribute('aria-expanded', String(open));
      }

      searchInput.addEventListener('input', event => {
        state.query = event.target.value;
        buildNav();
        if (state.query.trim()) showSearchResults(state.query);
        else showHome();
      });
      searchInput.addEventListener('keydown', event => {
        if (event.key === 'Enter' && state.query.trim()) {
          event.preventDefault();
          main.querySelector('.search-result')?.click();
        }
      });
      homeButton.addEventListener('click', showHome);
      rulesButton.addEventListener('click', showRules);
      mapButton.addEventListener('click', showMap);document.addEventListener('click',(function(e){var t=e.target;if(t.id==='poiToggle'){var p=document.getElementById('mobilePoiPanel');if(p)p.classList.toggle('mobile-open')}if(t.classList.contains('map-sheet-close')){t.closest('.map-sidebar')?.classList.remove('mobile-open')}}));
      newArticleButton.addEventListener('click', () => openWikiEditor());
      document.getElementById('sidebarClose').addEventListener('click', () => setSidebarOpen(false));
      document.getElementById('sidebarScrim').addEventListener('click', () => setSidebarOpen(false));
      document.getElementById('sidebar').addEventListener('click', event => {
        if (isMobile() && event.target.closest('.home-button, .rules-button, .map-button, .article-link')) setSidebarOpen(false);
      });
      let sidebarSwipeStart = null;
      document.getElementById('sidebar').addEventListener('touchstart', event => {
        const touch = event.touches[0];
        sidebarSwipeStart = touch ? { x: touch.clientX, y: touch.clientY } : null;
      }, { passive:true });
      document.getElementById('sidebar').addEventListener('touchend', event => {
        const touch = event.changedTouches[0];
        if (!sidebarSwipeStart || !touch) return;
        const deltaX = touch.clientX - sidebarSwipeStart.x;
        const deltaY = touch.clientY - sidebarSwipeStart.y;
        if (deltaX < -55 && Math.abs(deltaX) > Math.abs(deltaY) * 1.2) setSidebarOpen(false);
        sidebarSwipeStart = null;
      }, { passive:true });
      document.addEventListener('keydown', event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z' && state.activeId === 'map' && undoMapChange()) { event.preventDefault(); return; }
        if (state.activeId === 'map' && (event.key === 'Delete' || event.key === 'Backspace') && !event.target.matches('input, textarea, select') && state.map.selectedDrawings.length) { event.preventDefault(); requestDeleteDrawings(); return; }
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); searchInput.focus(); }
        if (event.key === 'Escape') {
          var s=document.getElementById('mobilePoiPanel'); if(s)s.classList.remove('mobile-open');
          setSidebarOpen(false);
          if (state.activeId === 'map') {
            clearPoiPreview();
            const form = document.getElementById('poiForm');
            if (form) form.innerHTML = '';
            if (state.selectedLocation || state.map.selectedDrawings.length) {
              state.selectedLocation = null;
              state.map.selectedDrawings = [];
              document.getElementById('mapDetail').hidden = true;
              renderMap();
            }
          }
        }
      });

      Promise.all([
        (function() {
          // If running as a local file (file:// protocol), browsers block fetch() for security.
          // In that case, fall back to XMLHttpRequest which still works with local files.
          if (location.protocol === 'file:') {
            return new Promise(function(resolve, reject) {
              var xhr = new XMLHttpRequest();
              xhr.open('GET', 'community-wiki-data.json', true);
              xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                  try { resolve(JSON.parse(xhr.responseText)); }
                  catch(e) { reject(new Error('Failed to parse wiki data JSON: ' + e.message)); }
                } else {
                  reject(new Error('Wiki data request failed (HTTP ' + xhr.status + ')'));
                }
              };
              xhr.onerror = function() { reject(new Error('Network error reading wiki data. This page must be served over HTTP/S — use a local web server.')); };
              xhr.send();
            });
          } else {
            // Running on http/https (GitHub Pages, localhost dev server, etc.) — normal fetch path
            return fetch('community-wiki-data.json').then(function(response) {
              if (!response.ok) throw new Error('Wiki data request failed (' + response.status + ')');
              return response.json();
            });
          }
        })()
      ])
        .then(wikiData => {
          // Defensive: handle both object and array responses gracefully
          const data = loadLocalWikiData(Array.isArray(wikiData) ? (wikiData[0] || {}) : wikiData);
          state.pages = (data?.pages || []);
          state.rulesRaw = data?.rulesRaw || '';
          state.ruleGuideLinks = data?.ruleGuideLinks || [];
          state.locations = data?.locations || [];
          preloadMapLayers();
          if (!state.pages.length) throw new Error('No wiki pages found in community data.');
          if (!state.rulesRaw) throw new Error('Rules source not found in community data.');
          rebuildWikiCollections(data?.categories || []);
          collaboration = window.createMapCollaboration({
            getSnapshot: () => ({ drawings:savedDrawings(), locations:savedLocations(), layers:{ ...state.map.annotationLayers } }),
            applySnapshot: snapshot => {
              saveDrawings(snapshot.drawings || [], false, false);
              saveLocations(snapshot.locations || [], false, false);
              state.map.annotationLayers = { ...state.map.annotationLayers, ...(snapshot.layers || {}) };
              if (state.activeId === 'map' && document.getElementById('mapCanvas')) renderMap();
            }
          });
          collaboration.init();
          showHome();
        })
        .catch(error => {
          main.innerHTML = `<div class="error"><strong>Wiki data could not be loaded.</strong><br>${escapeHtml(error.message)}<br><br><span id="fixHint">If opening from your hard drive, ensure <code>community-wiki-data.json</code> exists in the same folder. You can also run a local web server (e.g., <code>npx serve .</code>) for the best experience.</span></div>`;
          nav.innerHTML = '';
        });
    })();
  </script>
</body>
</html>
